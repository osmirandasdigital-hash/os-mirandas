<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Os Mirandas</title>
<meta name="description" content="Os Mirandas — fale com a gente pelo WhatsApp, Instagram ou e-mail.">
<meta property="og:title" content="Os Mirandas">
<meta property="og:description" content="Fale com a gente.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231f3a2e'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%23f4efe6' font-family='Georgia,serif'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6;
    --card: #fffdf8;
    --ink: #1f2a24;
    --muted: #5f6b64;
    --brand: #1f3a2e;
    --brand-ink: #f4efe6;
    --accent: #c9793b;
    --line: #e4dccd;
    --shadow: 0 1px 2px rgba(31,42,36,.06), 0 6px 18px rgba(31,42,36,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a17;
      --card: #1c2420;
      --ink: #eee8dc;
      --muted: #a3ada7;
      --brand: #e8dcc4;
      --brand-ink: #16201b;
      --accent: #e0995f;
      --line: #2c3631;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a17; --card: #1c2420; --ink: #eee8dc; --muted: #a3ada7;
    --brand: #e8dcc4; --brand-ink: #16201b; --accent: #e0995f; --line: #2c3631; --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px 32px;
  }
  main { width: 100%; max-width: 440px; }

  header { text-align: center; margin-bottom: 32px; }
  .avatar {
    width: 168px; height: 168px; border-radius: 50%;
    margin: 0 auto 16px;
    background: var(--brand); color: var(--brand-ink);
    display: grid; place-items: center;
    font: 600 44px/1 Fraunces, Georgia, serif;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; transform: scale(1.3); transform-origin: 62% 32%; }
  h1 { font: 600 28px/1.15 Fraunces, Georgia, serif; margin: 0 0 4px; letter-spacing: -.01em; }
  .handle { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .tagline { margin: 0 auto; max-width: 34ch; color: var(--ink); }

  nav { display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink); text-decoration: none;
    box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .15s ease;
  }
  .link:hover { transform: translateY(-1px); border-color: var(--accent); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .link svg { flex: none; width: 22px; height: 22px; }
  .link .text { flex: 1; min-width: 0; }
  .link strong { display: block; font-weight: 600; }
  .link span { display: block; font-size: 14px; color: var(--muted); }
  .link .arrow { color: var(--muted); font-size: 18px; }

  .link.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .link.primary span, .link.primary .arrow { color: var(--brand-ink); opacity: .8; }

  .link.product { border: 1.5px solid var(--accent); }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 2px;
  }

  /* Cartão do CONECTA: luz dourada girando na borda, reflexo que atravessa, capa flutuando */
  .destaque {
    position: relative; isolation: isolate; overflow: hidden;
    display: flex; align-items: center; gap: 18px;
    padding: 20px 18px 20px 20px; border-radius: 18px;
    background: #1f3a2e; color: #f3efe5; text-decoration: none;
    box-shadow: 0 10px 30px -12px rgba(20,36,28,.55);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .destaque::before {
    content: ""; position: absolute; inset: -80%; z-index: -2;
    background: conic-gradient(from 0deg, transparent 0 62%, #d9b77a 74%, #f3e3bd 78%, transparent 88%);
    animation: gira 4.5s linear infinite;
  }
  .destaque::after {
    content: ""; position: absolute; inset: 1.5px; z-index: -1; border-radius: 16.5px;
    background: radial-gradient(120% 90% at 0% 0%, #2c4a3c, #1f3a2e 55%, #14241c);
  }
  .destaque .reflexo {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(243,239,229,.16) 48%, transparent 60%);
    transform: translateX(-120%); animation: reflexo 5s ease-in-out 1.2s infinite;
  }
  .destaque .capa {
    flex: none; width: 76px; aspect-ratio: 894/1270; object-fit: cover; border-radius: 3px;
    box-shadow: 0 12px 22px -8px rgba(0,0,0,.6);
    rotate: -6deg; animation: flutua 4s ease-in-out infinite;
    transition: rotate .35s ease, scale .35s ease;
  }
  .destaque .txt { flex: 1; min-width: 0; }
  .destaque .selo {
    display: inline-flex; align-items: center; gap: 7px;
    font: 600 10.5px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #d9b77a;
  }
  .destaque .selo i { width: 7px; height: 7px; border-radius: 50%; background: #d9b77a; animation: pulsa 1.8s ease-out infinite; }
  .destaque strong { display: block; margin-top: 8px; font: 500 26px/1 Fraunces, Georgia, serif; letter-spacing: .04em; }
  .destaque .sub { display: block; margin-top: 6px; font-size: 13.5px; line-height: 1.4; color: rgba(243,239,229,.78); }
  .destaque .cta {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 14px;
    padding: 9px 14px; border-radius: 999px; background: #f3efe5; color: #1f3a2e;
    font-size: 13px; font-weight: 600;
  }
  .destaque .cta b { display: inline-block; animation: empurra 1.6s ease-in-out infinite; }
  .destaque:hover { transform: translateY(-3px); box-shadow: 0 18px 38px -14px rgba(20,36,28,.7); }
  .destaque:hover .capa { rotate: 0deg; scale: 1.06; }
  .destaque:focus-visible { outline: 2px solid #d9b77a; outline-offset: 3px; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @keyframes reflexo { 0% { transform: translateX(-120%); } 45%, 100% { transform: translateX(120%); } }
  @keyframes flutua { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
  @keyframes pulsa { 0% { box-shadow: 0 0 0 0 rgba(217,183,122,.7); } 100% { box-shadow: 0 0 0 9px rgba(217,183,122,0); } }
  @keyframes empurra { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) {
    .destaque *, .destaque::before { animation: none !important; }
    .destaque .reflexo { display: none; }
  }

  footer { text-align: center; margin-top: 36px; color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="avatar" id="avatar">M</div>
    <h1 id="nome">Os Mirandas</h1>
    <p class="handle" id="handle">@osmiirandas</p>
    <p class="tagline" id="tagline"></p>
  </header>

  <nav id="links"></nav>

  <footer id="rodape"></footer>
</main>

<script>
  // ============================================================
  //  EDITE AQUI — é só trocar os textos entre aspas.
  //  Deixe "" (vazio) para esconder o botão.
  // ============================================================
  const CONFIG = {
    nome: "Os Mirandas",
    instagram: "osmiirandas",                 // sem @
    frase: "Casamento intencional e uma vida com Cristo.",
    foto: "foto.webp",                        // arquivo na mesma pasta

    whatsapp: "5521966428636",                // só números, com DDI (55) e DDD
    mensagemWhatsapp: "Oi! Vim pelo Instagram e quero saber mais.",
    email: "osmirandasdigital@gmail.com",

    // Cartão em destaque do produto (o primeiro da lista)
    produto: {
      link: "conecta/venda/",                  // página de vendas do CONECTA
      selo: "Novo",
      titulo: "CONECTA",
      descricao: "Uma pausa guiada para vocês voltarem um para o outro.",
      chamada: "Quero conhecer",
      capa: "conecta/venda/img/capa.jpg",
    },
  };
  // ============================================================

  const icons = {
    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
    email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    produto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9L12 3Z"/></svg>',
  };

  function linkItem({ href, icon, title, sub, cls = "", badge = "" }) {
    const a = document.createElement("a");
    a.className = "link " + cls;
    a.href = href;
    if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML =
      icons[icon] +
      '<div class="text">' +
        (badge ? '<em class="badge">' + badge + '</em>' : '') +
        '<strong></strong><span></span>' +
      '</div><div class="arrow" aria-hidden="true">›</div>';
    a.querySelector("strong").textContent = title;
    a.querySelector("span").textContent = sub;
    return a;
  }

  const c = CONFIG;
  document.title = c.nome;
  document.getElementById("nome").textContent = c.nome;
  document.getElementById("handle").textContent = "@" + c.instagram;
  document.getElementById("tagline").textContent = c.frase;
  document.getElementById("rodape").textContent = "© " + new Date().getFullYear() + " " + c.nome;
  if (c.foto) {
    const img = new Image();
    img.src = c.foto; img.alt = c.nome;
    const av = document.getElementById("avatar");
    av.textContent = ""; av.appendChild(img);
  }

  const nav = document.getElementById("links");
  if (c.produto.link) {
    const p = c.produto, a = document.createElement("a");
    a.className = "destaque";
    a.href = p.link;
    a.innerHTML =
      '<span class="reflexo" aria-hidden="true"></span>' +
      (p.capa ? '<img class="capa" alt="">' : '') +
      '<div class="txt"><span class="selo"><i></i></span><strong></strong><span class="sub"></span>' +
      '<span class="cta"><span></span><b aria-hidden="true">→</b></span></div>';
    if (p.capa) a.querySelector(".capa").src = p.capa;
    a.querySelector(".selo").append(p.selo);
    a.querySelector("strong").textContent = p.titulo;
    a.querySelector(".sub").textContent = p.descricao;
    a.querySelector(".cta span").textContent = p.chamada;
    nav.appendChild(a);
  }
  if (c.whatsapp) {
    nav.appendChild(linkItem({
      href: "https://wa.me/" + c.whatsapp.replace(/\D/g, "") + "?text=" + encodeURIComponent(c.mensagemWhatsapp),
      icon: "whatsapp", title: "Chamar no WhatsApp", sub: "Resposta de segunda a sexta", cls: "primary",
    }));
  }
  if (c.instagram) {
    nav.appendChild(linkItem({ href: "https://instagram.com/" + c.instagram, icon: "instagram", title: "Instagram", sub: "@" + c.instagram }));
  }
  if (c.email) {
    nav.appendChild(linkItem({ href: "mailto:" + c.email, icon: "email", title: "E-mail", sub: c.email }));
  }
</script>
</body>
</html>
